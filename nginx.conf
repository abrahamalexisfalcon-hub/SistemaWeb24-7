server {
    listen 80;
    server_name app.24-7asistencias.com 179.197.81.227;
    client_max_body_size 25M;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.24-7asistencias.com 179.197.81.227;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/app.24-7asistencias.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.24-7asistencias.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Evitar caché en el Service Worker de OneSignal
    location = /OneSignalSDKWorker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Proxy pass hacia el contenedor backend en Docker Compose
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA routing para React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para recursos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
