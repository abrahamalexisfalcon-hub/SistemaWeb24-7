<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Plataforma de gestión de asistencias técnicas domiciliarias 24/7" />
    
    <!-- Favicon dinámico según tema del sistema (Dark: blanco, Light: negro) -->
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <!-- Iconos oficiales PWA y dispositivos móviles -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" id="dynamic-favicon" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- OneSignal Web Push SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <title>24/7 Asistencias | Gestión Operativa</title>

    <script>
      (function() {
        try {
          var darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
          function updateFavicon(e) {
            var isDark = e ? e.matches : darkScheme.matches;
            var fav = document.getElementById('dynamic-favicon');
            if (fav) {
              fav.href = isDark ? '/favicon-dark.png' : '/favicon-light.png';
            }
          }
          if (darkScheme.addEventListener) {
            darkScheme.addEventListener('change', updateFavicon);
          } else if (darkScheme.addListener) {
            darkScheme.addListener(updateFavicon);
          }
          updateFavicon();
        } catch (err) {}

        // Limpieza temprana de Service Workers antiguos (Workbox) y CacheStorage en móviles
        try {
          var cleanupPromises = [];
          var foundLegacyCacheOrSw = false;

          if ('serviceWorker' in navigator) {
            cleanupPromises.push(
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                var unregPromises = [];
                for (var i = 0; i < registrations.length; i++) {
                  var reg = registrations[i];
                  var scriptUrl =
                    (reg.active && reg.active.scriptURL) ||
                    (reg.installing && reg.installing.scriptURL) ||
                    (reg.waiting && reg.waiting.scriptURL) ||
                    '';
                  if (scriptUrl && scriptUrl.indexOf('OneSignalSDKWorker.js') === -1) {
                    foundLegacyCacheOrSw = true;
                    unregPromises.push(reg.unregister());
                  }
                }
                return Promise.all(unregPromises);
              })
            );
          }

          if ('caches' in window) {
            cleanupPromises.push(
              caches.keys().then(function(keys) {
                var delPromises = [];
                for (var j = 0; j < keys.length; j++) {
                  foundLegacyCacheOrSw = true;
                  delPromises.push(caches.delete(keys[j]));
                }
                return Promise.all(delPromises);
              })
            );
          }

          if (cleanupPromises.length > 0) {
            Promise.all(cleanupPromises).then(function() {
              if (foundLegacyCacheOrSw && !sessionStorage.getItem('sw_cache_purged_v1')) {
                sessionStorage.setItem('sw_cache_purged_v1', '1');
                window.location.reload();
              }
            }).catch(function() {});
          }
        } catch (swErr) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
