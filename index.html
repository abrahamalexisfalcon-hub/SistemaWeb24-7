<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Plataforma de gestión de asistencias técnicas domiciliarias 24/7" />
    
    <!-- Favicon dinámico según tema del sistema (Dark: blanco, Light: negro) -->
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <!-- Fallback default icon -->
    <link rel="icon" type="image/png" href="/favicon-dark.png" id="dynamic-favicon" />
    <link rel="apple-touch-icon" href="/favicon-dark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>24/7 Asistencias | Gestión Operativa</title>

    <script>
      (function() {
        try {
          var darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
          function updateFavicon(e) {
            var isDark = e ? e.matches : darkScheme.matches;
            var fav = document.getElementById('dynamic-favicon');
            if (fav) {
              fav.href = isDark ? '/favicon-dark.png' : '/favicon-light.png';
            }
          }
          if (darkScheme.addEventListener) {
            darkScheme.addEventListener('change', updateFavicon);
          } else if (darkScheme.addListener) {
            darkScheme.addListener(updateFavicon);
          }
          updateFavicon();
        } catch (err) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
